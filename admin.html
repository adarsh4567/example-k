      // ---------- Filter 2: Trial Job management ----------
      // Categories mirror serviceCatalog on the backend (validated server-side too).
      var TRIAL_CATEGORIES = ['cleaning', 'electrical', 'cooking', 'plumbing', 'carpentry', 'ac_repair', 'painting', 'pest_control'];

      // Mirrors config/trialQuestions.js — used to render the customer's answers readably.
      var TRIAL_QUESTIONS = [
        { key: 'q1', label: 'Arrived on time?', opts: { on_time: 'On time', slightly_late: 'Slightly late', very_late: 'Very late' } },
        { key: 'q2', label: 'Presentable?', opts: { presentable: 'Presentable', average: 'Average', unkempt: 'Unkempt' } },
        { key: 'q3', label: 'Polite?', opts: { polite: 'Polite', neutral: 'Neutral', rude: 'Rude' } },
        { key: 'q4', label: 'Followed instructions?', opts: { yes: 'Yes, fully', partially: 'Partially', no: 'No' } },
        { key: 'q5', label: 'Careful & thorough?', opts: { thorough: 'Thorough', acceptable: 'Acceptable', careless: 'Careless' } },
        { key: 'q6', label: 'Came prepared?', opts: { prepared: 'Prepared', partially: 'Partially prepared', unprepared: 'Unprepared' } },
        { key: 'q7', label: 'Overall quality?', opts: { good: 'Good', average: 'Average', poor: 'Poor' } },
        { key: 'q8', label: 'Felt comfortable / safe?', opts: { comfortable: 'Comfortable', somewhat: 'Somewhat', uncomfortable: 'Uncomfortable' } },
        { key: 'q9', label: 'Would book again?', opts: { yes_definitely: 'Yes, definitely', yes_maybe: 'Maybe', no: 'No' } },
      ];
      // Answers that force a fail (highlighted red so the reviewer sees why it's conditional).
      var TRIAL_HARD_FAIL = { q5: 'careless', q8: 'uncomfortable', q9: 'no' };

      var trialQueueBtn = document.getElementById('trialQueueBtn');
      trialQueueBtn.addEventListener('click', openTrialQueue);

      function decisionChip(decision) {
        var map = {
          strong_pass: ['#e3f7e9', '#1f9254', 'Strong pass'],
          conditional: ['#fff8d6', '#93750a', 'Conditional'],
          fail: ['#fde8e8', '#b23434', 'Fail'],
        };
        var m = map[decision];
        if (!m) return '<span class="chip">no feedback yet</span>';
        return '<span class="chip" style="background:' + m[0] + ';color:' + m[1] + ';">' + m[2] + '</span>';
      }

      function trialEarning(p) {
        if (!p) return '—';
        var userPrice = (p.userPrice != null ? p.userPrice : p.totalPrice);
        var base = (p.basePrice != null ? p.basePrice : '?');
        var cashback = (p.userWalletCredit != null ? p.userWalletCredit : 0);
        return 'worker earns ₹' + p.workerEarning + ' · user pays ₹' + userPrice +
          ' (base ₹' + base + ') · user wallet +₹' + cashback;
      }

      function emptyLine(text) {
        var p = document.createElement('p');
        p.style.cssText = 'color:var(--muted);font-size:13px;margin:0 0 8px;';
        p.textContent = text;
        return p;
      }

      function trialSectionTitle(text) {
        var h = document.createElement('h3');
        h.textContent = text;
        h.style.cssText = 'font-size:12px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);margin:18px 0 10px;border-bottom:1px solid var(--border);padding-bottom:6px;';
        return h;
      }

      function trialRow(title, subtitle, actionLabel, onAction, extraHtml) {
        var row = document.createElement('div');
        row.className = 'detail-section';
        row.innerHTML = safe`
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
            <div>
              <strong>${title}</strong><br/>
              <span style="color:var(--muted);font-size:12px;">${subtitle}</span>
            </div>
            <button class="secondary">${actionLabel}</button>
          </div>
          <div class="chip-row" style="margin-top:6px;"></div>
        `;
        if (extraHtml) row.querySelector('.chip-row').innerHTML = extraHtml;
        row.querySelector('button').addEventListener('click', onAction);
        return row;
      }

      function openTrialQueue() {
        api('/api/admin/trial-queue')
          .then(function (data) { renderTrialQueue(data); })
          .catch(function (err) { toast(err.message, 'error'); });
      }

      // Geo matcher: enter the user's location; show pending-trial workers whose
      // own travel radius covers it (nearest first), then assign — the real
      // dispatch match, applied to the directed trial offer.
      function buildTrialGeoMatcher() {
        var wrap = document.createElement('div');
        wrap.className = 'detail-section';
        wrap.innerHTML = '<h3>📍 Send a trial to a nearby worker</h3>' +
          '<p style="font-size:12px;color:var(--muted);margin:0 0 10px;">Enter the user\'s location. Pending-trial workers whose travel radius covers this point appear below, nearest first.</p>';

        var row = document.createElement('div');
        row.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;align-items:center;';
        var latIn = document.createElement('input');
        latIn.type = 'number'; latIn.step = 'any'; latIn.placeholder = 'User latitude (e.g. 12.9716)';
        latIn.style.cssText = 'flex:1;min-width:160px;';
        var lngIn = document.createElement('input');
        lngIn.type = 'number'; lngIn.step = 'any'; lngIn.placeholder = 'User longitude (e.g. 77.5946)';
        lngIn.style.cssText = 'flex:1;min-width:160px;';
        var findBtn = document.createElement('button');
        findBtn.textContent = 'Find nearby workers';
        row.appendChild(latIn); row.appendChild(lngIn); row.appendChild(findBtn);
        wrap.appendChild(row);

        var results = document.createElement('div');
        results.style.marginTop = '12px';
        wrap.appendChild(results);

        findBtn.addEventListener('click', function () {
          var lat = Number(latIn.value), lng = Number(lngIn.value);
          if (latIn.value === '' || lngIn.value === '' || isNaN(lat) || isNaN(lng)) {
            toast('Enter a valid user latitude and longitude', 'error'); return;
          }
          results.innerHTML = '<p style="color:var(--muted);font-size:13px;">Searching…</p>';
          api('/api/admin/trial/nearby-workers?lat=' + lat + '&lng=' + lng)
            .then(function (data) {
              var ws = data.workers || [];
              results.innerHTML = '';
              var head = document.createElement('div');
              head.style.cssText = 'font-size:12px;color:var(--muted);margin-bottom:8px;';
              head.textContent = ws.length + ' worker(s) can serve this location';
              results.appendChild(head);
              if (!ws.length) {
                results.appendChild(emptyLine('No pending-trial worker covers this location (they may not have shared their current location yet).'));
                return;
              }
              ws.forEach(function (wk) {
                results.appendChild(trialRow(
                  (wk.fullName || '(no name)') + ' — ' + (wk.phone || ''),
                  (wk.city || '—') + ' · ' + wk.distanceKm + ' km away · covers ' + (wk.travelRadiusKm || '?') + ' km',
                  'Assign →',
                  function () { openAssignForm({ _id: wk._id, fullName: wk.fullName, phone: wk.phone }, { lat: lat, lng: lng }); }
                ));
              });
            })
            .catch(function (err) { results.innerHTML = ''; toast(err.message, 'error'); });
        });

        return wrap;
      }

      function renderTrialQueue(data) {
        closeModal();
        var counts = data.counts || {};

        var overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });

        var box = document.createElement('div');
        box.className = 'modal-box';

        var header = document.createElement('div');
        header.className = 'modal-header';
        header.innerHTML = safe`<h2>🧪 Trial Queue</h2>`;
        var closeBtn = document.createElement('button');
        closeBtn.className = 'ghost';
        closeBtn.textContent = '✕';
        closeBtn.addEventListener('click', closeModal);
        header.appendChild(closeBtn);

        var body = document.createElement('div');
        body.className = 'modal-body';

        // 0. Geo matcher — assign based on the user's location + worker travel radius.
        body.appendChild(buildTrialGeoMatcher());

        // 1. Conditional verdicts that need a human decision.
        body.appendChild(trialSectionTitle('Awaiting your decision · ' + (counts.awaitingDecision || 0)));
        var ad = data.awaitingDecision || [];
        if (!ad.length) body.appendChild(emptyLine('Nothing needs a manual decision right now.'));
        else ad.forEach(function (job) {
          var w = job.worker || {};
          body.appendChild(trialRow(
            (w.fullName || '(no name)') + ' — ' + (w.phone || ''),
            job.category + (job.subcategory ? ' · ' + job.subcategory : '') + ' · completed ' + fmtDate(job.completedAt),
            'Review →',
            function () { openTrialDecision(job.id); },
            decisionChip(job.feedback && job.feedback.decision)
          ));
        });

        // 2. Completed, customer feedback not in yet (grab the link to submit a demo).
        body.appendChild(trialSectionTitle('Awaiting customer feedback · ' + (counts.awaitingFeedback || 0)));
        var af = data.awaitingFeedback || [];
        if (!af.length) body.appendChild(emptyLine('No trials waiting on feedback.'));
        else af.forEach(function (job) {
          var w = job.worker || {};
          body.appendChild(trialRow(
            (w.fullName || '(no name)') + ' — ' + (w.phone || ''),
            job.category + ' · completed ' + fmtDate(job.completedAt),
            '🗒 Submit feedback →',
            function () { openFeedbackForm(job.id); }
          ));
        });

        // 3. Workers who cleared review and are waiting to be assigned a trial.
        body.appendChild(trialSectionTitle('Waiting for a trial · ' + (counts.pendingTrial || 0)));
        var pt = data.pendingTrial || [];
        if (!pt.length) body.appendChild(emptyLine('No workers are waiting for a trial.'));
        else pt.forEach(function (w) {
          body.appendChild(trialRow(
            (w.fullName || '(no name)') + ' — ' + (w.phone || ''),
            ((w.location && w.location.city) || '—') + ' · waiting since ' + fmtDate(w.updatedAt),
            'Assign →',
            function () { openAssignForm({ _id: w._id, fullName: w.fullName, phone: w.phone }); }
          ));
        });

        box.appendChild(header);
        box.appendChild(body);
        overlay.appendChild(box);
        document.body.appendChild(overlay);
      }

      // ---- Assign a trial job ----
      function trialField(labelText, control, hint) {
        var wrap = document.createElement('div');
        wrap.style.cssText = 'display:flex;flex-direction:column;gap:6px;margin-bottom:12px;';
        var label = document.createElement('label');
        label.textContent = labelText;
        label.style.cssText = 'font-size:12px;font-weight:600;color:var(--muted);';
        wrap.appendChild(label);
        wrap.appendChild(control);
        if (hint) {
          var h = document.createElement('span');
          h.textContent = hint;
          h.style.cssText = 'font-size:11px;color:var(--muted);';
          wrap.appendChild(h);
        }
        return wrap;
      }

      function openAssignForm(worker, prefill) {
        prefill = prefill || {};
        closeModal();

        var overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });

        var box = document.createElement('div');
        box.className = 'modal-box';

        var header = document.createElement('div');
        header.className = 'modal-header';
        header.innerHTML = safe`<h2>🧪 Assign trial — ${worker.fullName || '(no name)'} · ${worker.phone || ''}</h2>`;
        var closeBtn = document.createElement('button');
        closeBtn.className = 'ghost';
        closeBtn.textContent = '✕';
        closeBtn.addEventListener('click', closeModal);
        header.appendChild(closeBtn);

        var body = document.createElement('div');
        body.className = 'modal-body';

        var hostName = document.createElement('input');
        hostName.type = 'text'; hostName.placeholder = 'e.g. Demo Host';
        var hostPhone = document.createElement('input');
        hostPhone.type = 'text'; hostPhone.placeholder = 'e.g. 9111111111';

        var category = document.createElement('select');
        TRIAL_CATEGORIES.forEach(function (c) {
          var o = document.createElement('option');
          o.value = c; o.textContent = c;
          category.appendChild(o);
        });
        var subcategory = document.createElement('input');
        subcategory.type = 'text'; subcategory.placeholder = 'optional, e.g. kitchen';

        var jobDescription = document.createElement('textarea');
        jobDescription.placeholder = 'What the trial job involves';

        var address = document.createElement('input');
        address.type = 'text'; address.placeholder = 'e.g. 1 Demo St';

        var lat = document.createElement('input');
        lat.type = 'number'; lat.step = 'any'; lat.placeholder = '12.9716';
        var lng = document.createElement('input');
        lng.type = 'number'; lng.step = 'any'; lng.placeholder = '77.5946';
        // Prefilled with the matched user location when opened from the geo matcher.
        if (prefill.lat !== undefined && prefill.lat !== null) lat.value = prefill.lat;
        if (prefill.lng !== undefined && prefill.lng !== null) lng.value = prefill.lng;

        var scheduledTime = document.createElement('input');
        scheduledTime.type = 'datetime-local';

        [hostName, hostPhone, category, subcategory, jobDescription, address, lat, lng, scheduledTime].forEach(function (el) {
          el.style.width = '100%';
        });

        body.appendChild(trialField('Host name *', hostName));
        body.appendChild(trialField('Host phone *', hostPhone));
        body.appendChild(trialField('Category *', category));
        body.appendChild(trialField('Subcategory', subcategory));
        body.appendChild(trialField('Job description *', jobDescription));
        body.appendChild(trialField('Address', address));
        body.appendChild(trialField('Latitude *', lat));
        body.appendChild(trialField('Longitude *', lng));
        body.appendChild(trialField('Scheduled time', scheduledTime, 'Trial pricing: the user pays a discounted price, the worker keeps the full amount (no commission), and the user gets wallet cashback. Offer expires ~90s after assigning.'));

        var footer = document.createElement('div');
        footer.className = 'modal-footer';

        var assignBtn = document.createElement('button');
        assignBtn.textContent = '🧪 Assign trial';
        assignBtn.addEventListener('click', function () {
          var payload = {
            workerId: worker._id,
            hostName: hostName.value.trim(),
            hostPhone: hostPhone.value.trim(),
            category: category.value,
            subcategory: subcategory.value.trim() || undefined,
            jobDescription: jobDescription.value.trim(),
            address: address.value.trim(),
            lat: Number(lat.value),
            lng: Number(lng.value),
            scheduledTime: scheduledTime.value ? new Date(scheduledTime.value).toISOString() : undefined,
          };
          if (!payload.hostName || !payload.hostPhone) { toast('Host name and phone are required', 'error'); return; }
          if (!payload.jobDescription) { toast('Job description is required', 'error'); return; }
          if (isNaN(payload.lat) || isNaN(payload.lng)) { toast('Valid latitude and longitude are required', 'error'); return; }

          var btns = footer.querySelectorAll('button');
          btns.forEach(function (b) { b.disabled = true; });
          api('/api/admin/trial/assign', { method: 'POST', body: JSON.stringify(payload) })
            .then(function () {
              toast('Trial assigned to ' + (worker.fullName || 'worker'), 'success');
              closeModal();
              loadWorkers();
            })
            .catch(function (err) {
              toast(err.message, 'error');
              btns.forEach(function (b) { b.disabled = false; });
            });
        });

        var cancelBtn = document.createElement('button');
        cancelBtn.className = 'secondary';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.addEventListener('click', closeModal);

        footer.appendChild(assignBtn);
        footer.appendChild(cancelBtn);

        box.appendChild(header);
        box.appendChild(body);
        box.appendChild(footer);
        overlay.appendChild(box);
        document.body.appendChild(overlay);
      }

      // ---- Customer feedback (stands in for the not-yet-built user/customer app) ----
      // Renders the 10-question form in-panel and submits it to the PUBLIC feedback
      // endpoint using the job's signed one-time token — exactly what the customer
      // app would POST. No admin-only backend endpoint needed.
      var FEEDBACK_POSITIVE = {
        q1: 'on_time', q2: 'presentable', q3: 'polite', q4: 'yes', q5: 'thorough',
        q6: 'prepared', q7: 'good', q8: 'comfortable', q9: 'yes_definitely',
      };

      function openFeedbackForm(id) {
        api('/api/admin/trial/' + id)
          .then(function (data) {
            var job = data.trialJob || {};
            if (!job.feedbackLink) { toast('Feedback already submitted for this trial.', 'error'); return; }
            renderFeedbackForm(job);
          })
          .catch(function (err) { toast(err.message, 'error'); });
      }

      // Turn the absolute feedbackLink into a path so api() hits this same server
      // (the token is host-agnostic — signed server-side, not tied to the origin).
      function feedbackPath(job) {
        try { return new URL(job.feedbackLink).pathname; }
        catch (e) { return job.feedbackLink.replace(/^https?:\/\/[^/]+/, ''); }
      }

      function renderFeedbackForm(job) {
        closeModal();
        var w = job.worker || {};

        var overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });

        var box = document.createElement('div');
        box.className = 'modal-box';

        var header = document.createElement('div');
        header.className = 'modal-header';
        header.innerHTML = safe`<h2>🗒 Customer feedback — ${w.fullName || '(no name)'}</h2>`;
        var closeBtn = document.createElement('button');
        closeBtn.className = 'ghost';
        closeBtn.textContent = '✕';
        closeBtn.addEventListener('click', closeModal);
        header.appendChild(closeBtn);

        var body = document.createElement('div');
        body.className = 'modal-body';
        body.innerHTML = safe`
          <p style="font-size:13px;color:var(--muted);margin-top:0;">
            Standing in for the customer/user app. Answer as the trial host would — the decision
            engine scores it on submit: all-positive + "definitely" ⇒ approved, any hard-fail ⇒ rejected,
            anything else ⇒ conditional (lands back here for your manual decision).
          </p>
        `;

        // Quick-fill helpers to speed up click-through testing.
        var quickRow = document.createElement('div');
        quickRow.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;';
        var fillPositive = document.createElement('button');
        fillPositive.className = 'secondary';
        fillPositive.textContent = '✓ Fill all-positive';
        var fillFail = document.createElement('button');
        fillFail.className = 'secondary';
        fillFail.textContent = '⚠ Fill a fail';
        quickRow.appendChild(fillPositive);
        quickRow.appendChild(fillFail);
        body.appendChild(quickRow);

        var selects = {};
        TRIAL_QUESTIONS.forEach(function (q) {
          var sel = document.createElement('select');
          sel.style.width = '100%';
          var ph = document.createElement('option');
          ph.value = ''; ph.textContent = 'Select…';
          sel.appendChild(ph);
          Object.keys(q.opts).forEach(function (val) {
            var o = document.createElement('option');
            o.value = val; o.textContent = q.opts[val];
            sel.appendChild(o);
          });
          selects[q.key] = sel;
          body.appendChild(trialField(q.label, sel));
        });

        var comments = document.createElement('textarea');
        comments.style.width = '100%';
        comments.placeholder = 'Optional comments';
        body.appendChild(trialField('Comments', comments));

        fillPositive.addEventListener('click', function () {
          Object.keys(FEEDBACK_POSITIVE).forEach(function (k) { if (selects[k]) selects[k].value = FEEDBACK_POSITIVE[k]; });
        });
        fillFail.addEventListener('click', function () {
          Object.keys(FEEDBACK_POSITIVE).forEach(function (k) { if (selects[k]) selects[k].value = FEEDBACK_POSITIVE[k]; });
          if (selects.q8) selects.q8.value = 'uncomfortable'; // any single hard-fail answer
        });

        var footer = document.createElement('div');
        footer.className = 'modal-footer';

        var submitBtn = document.createElement('button');
        submitBtn.textContent = 'Submit feedback';
        submitBtn.addEventListener('click', function () {
          var answers = {};
          var missing = null;
          TRIAL_QUESTIONS.forEach(function (q) {
            if (!selects[q.key].value) { missing = missing || q.label; return; }
            answers[q.key] = selects[q.key].value;
          });
          if (missing) { toast('Please answer: ' + missing, 'error'); return; }
          if (comments.value.trim()) answers.q10 = comments.value.trim();

          var btns = footer.querySelectorAll('button');
          btns.forEach(function (b) { b.disabled = true; });
          api(feedbackPath(job), { method: 'POST', body: JSON.stringify({ answers: answers }) })
            .then(function (res) {
              toast('Feedback submitted — verdict: ' + (res.decision || '?'), 'success');
              closeModal();
              openTrialQueue();
              loadWorkers();
            })
            .catch(function (err) {
              toast(err.message, 'error');
              btns.forEach(function (b) { b.disabled = false; });
            });
        });

        var linkBtn = document.createElement('button');
        linkBtn.className = 'secondary';
        linkBtn.textContent = '🔗 Copy raw link';
        linkBtn.addEventListener('click', function () { showLinkModal(job.feedbackLink); });

        var cancelBtn = document.createElement('button');
        cancelBtn.className = 'secondary';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.addEventListener('click', closeModal);

        footer.appendChild(submitBtn);
        footer.appendChild(linkBtn);
        footer.appendChild(cancelBtn);

        box.appendChild(header);
        box.appendChild(body);
        box.appendChild(footer);
        overlay.appendChild(box);
        document.body.appendChild(overlay);
      }

      function showLinkModal(link) {
        closeModal();
        var overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });

        var box = document.createElement('div');
        box.className = 'modal-box';

        var header = document.createElement('div');
        header.className = 'modal-header';
        header.innerHTML = safe`<h2>🔗 Customer feedback link</h2>`;
        var closeBtn = document.createElement('button');
        closeBtn.className = 'ghost';
        closeBtn.textContent = '✕';
        closeBtn.addEventListener('click', closeModal);
        header.appendChild(closeBtn);

        var body = document.createElement('div');
        body.className = 'modal-body';
        body.innerHTML = '<p style="font-size:13px;color:var(--muted);margin-top:0;">The customer would normally receive this by SMS. For a demo, POST the 10 answers to this URL (single-use).</p>';
        var input = document.createElement('input');
        input.type = 'text';
        input.readOnly = true;
        input.value = link;
        input.style.width = '100%';
        input.addEventListener('focus', function () { input.select(); });
        body.appendChild(input);

        box.appendChild(header);
        box.appendChild(body);
        overlay.appendChild(box);
        document.body.appendChild(overlay);
        setTimeout(function () { input.focus(); }, 50);
      }

      // ---- Review a conditional trial and finalise it ----
      function openTrialDecision(id) {
        api('/api/admin/trial/' + id)
          .then(function (data) { renderTrialDecision(data.trialJob); })
          .catch(function (err) { toast(err.message, 'error'); });
      }

      function renderTrialDecision(job) {
        closeModal();
        var w = job.worker || {};
        var fb = job.feedback || {};
        var ans = fb.answers || {};

        var overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });

        var box = document.createElement('div');
        box.className = 'modal-box';

        var header = document.createElement('div');
        header.className = 'modal-header';
        header.innerHTML = safe`<h2>Trial review — ${w.fullName || '(no name)'} · ${w.phone || ''}</h2>`;
        var closeBtn = document.createElement('button');
        closeBtn.className = 'ghost';
        closeBtn.textContent = '✕';
        closeBtn.addEventListener('click', closeModal);
        header.appendChild(closeBtn);

        var body = document.createElement('div');
        body.className = 'modal-body';

        // Job summary
        var jobSection = document.createElement('div');
        jobSection.className = 'detail-section';
        jobSection.innerHTML = safe`
          <h3>Trial job</h3>
          <div class="kv-grid">
            <dt>Service</dt><dd>${job.category}${job.subcategory ? ' · ' + job.subcategory : ''}</dd>
            <dt>Description</dt><dd>${job.jobDescription}</dd>
            <dt>Host</dt><dd>${(job.host && job.host.name) || '—'} · ${(job.host && job.host.phone) || '—'}</dd>
            <dt>Address</dt><dd>${job.address || '—'}</dd>
            <dt>Earning</dt><dd>${trialEarning(job.pricing)}</dd>
            <dt>Completed</dt><dd>${fmtDate(job.completedAt)}</dd>
          </div>
        `;
        body.appendChild(jobSection);

        // Feedback + answers
        var fbSection = document.createElement('div');
        fbSection.className = 'detail-section';
        var answersHtml = TRIAL_QUESTIONS.map(function (q) {
          var v = ans[q.key];
          var label = (v && q.opts[v]) || v || '—';
          var isHard = TRIAL_HARD_FAIL[q.key] === v;
          return '<dt>' + escapeHtml(q.label) + '</dt><dd style="' + (isHard ? 'color:var(--danger);font-weight:600;' : '') + '">' + escapeHtml(label) + '</dd>';
        }).join('');
        fbSection.innerHTML =
          '<h3>Customer feedback</h3>' +
          '<div style="margin-bottom:10px;">' + decisionChip(fb.decision) +
          ' <span style="color:var(--muted);font-size:12px;">submitted ' + escapeHtml(fmtDate(fb.submittedAt)) + '</span></div>' +
          '<div class="kv-grid">' + answersHtml + '</div>' +
          '<div class="kv-grid" style="margin-top:8px;"><dt>Comments</dt><dd>' + escapeHtml(ans.q10 || '—') + '</dd></div>';
        body.appendChild(fbSection);

        // Notes
        var notesSection = document.createElement('div');
        notesSection.className = 'detail-section';
        notesSection.innerHTML = '<h3>Your notes</h3>';
        var notes = document.createElement('textarea');
        notes.style.cssText = 'width:100%;min-height:60px;';
        notes.placeholder = 'Optional for approve · required for reject';
        notesSection.appendChild(notes);
        body.appendChild(notesSection);

        // Footer actions — only if the worker is still awaiting a decision.
        var footer = document.createElement('div');
        footer.className = 'modal-footer';
        var awaiting = w.status === 'trial_completed';

        if (!awaiting) {
          var note = document.createElement('p');
          note.style.cssText = 'color:var(--muted);font-size:13px;margin:0;';
          note.textContent = 'No actions available — the worker is already ' + (STATUS_LABELS[w.status] || w.status) + '.';
          footer.appendChild(note);
        } else {
          var approveBtn = document.createElement('button');
          approveBtn.textContent = '✓ Approve';
          approveBtn.addEventListener('click', function () {
            if (confirm('Approve this trial? The worker becomes approved and can accept jobs.')) {
              submitTrialDecision(job.id, { decision: 'approve', notes: notes.value.trim() }, 'Worker approved after trial', footer);
            }
          });

          var rejectBtn = document.createElement('button');
          rejectBtn.className = 'danger';
          rejectBtn.textContent = '✕ Reject';
          rejectBtn.addEventListener('click', function () {
            if (!notes.value.trim()) { toast('A reason (notes) is required to reject', 'error'); notes.focus(); return; }
            submitTrialDecision(job.id, { decision: 'reject', notes: notes.value.trim() }, 'Worker rejected after trial', footer);
          });

          footer.appendChild(approveBtn);
          footer.appendChild(rejectBtn);
        }

        box.appendChild(header);
        box.appendChild(body);
        box.appendChild(footer);
        overlay.appendChild(box);
        document.body.appendChild(overlay);
      }

      function submitTrialDecision(id, payload, successMsg, footer) {
        var btns = footer.querySelectorAll('button');
        btns.forEach(function (b) { b.disabled = true; });
        api('/api/admin/trial/' + id + '/decision', { method: 'POST', body: JSON.stringify(payload) })
          .then(function () {
            toast(successMsg, 'success');
            closeModal();
            openTrialQueue();
            loadWorkers();
          })
          .catch(function (err) {
            toast(err.message, 'error');
            btns.forEach(function (b) { b.disabled = false; });
          });
      }

      /* ==================================================================
         Filter 3 — Electrical Shop Assessment
         Assessment review queue, shop-partner management, slot calendar and
         payouts. Follows the same modal + api() + safe`` conventions as the
         video / specialization / trial views above.
         ================================================================== */

      // Shared modal scaffold — the four queue views below all need the same
      // overlay/header/body/footer skeleton.
      function modalShell(titleHtml, opts) {
        opts = opts || {};
        closeModal();
        var overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });

        var box = document.createElement('div');
        box.className = 'modal-box';
        if (opts.wide) box.style.maxWidth = '1100px';

        var header = document.createElement('div');
        header.className = 'modal-header';
        header.innerHTML = '<h2>' + titleHtml + '</h2>';
        var closeBtn = document.createElement('button');
        closeBtn.className = 'ghost';
        closeBtn.textContent = '✕';
        closeBtn.addEventListener('click', closeModal);
        header.appendChild(closeBtn);

        var body = document.createElement('div');
        body.className = 'modal-body';

        var footer = document.createElement('div');
        footer.className = 'modal-footer';

        box.appendChild(header);
        box.appendChild(body);
        box.appendChild(footer);
        overlay.appendChild(box);
        document.body.appendChild(overlay);
        return { overlay: overlay, box: box, header: header, body: body, footer: footer };
      }

      function badge(status) {
        return safe`<span class="badge badge-${status}">${String(status || '—').replace(/_/g, ' ')}</span>`;
      }

      function qualityClass(score) {
        if (score === null || score === undefined) return '';
        if (score > 80) return 'q-good';
        if (score >= 60) return 'q-warn';
        return 'q-bad';
      }

      function fmtMoney(n) {
        return '₹' + Number(n || 0).toLocaleString('en-IN');
      }

      function tabBar(tabs, activeKey, onPick) {
        var wrap = document.createElement('div');
        wrap.className = 'tabbar';
        tabs.forEach(function (t) {
          var b = document.createElement('button');
          b.className = 'secondary' + (t.key === activeKey ? ' active' : '');
          b.textContent = t.label;
          b.addEventListener('click', function () { onPick(t.key); });
          wrap.appendChild(b);
        });
        return wrap;
      }

      // ---------- Assessment queue ----------
      var assessmentQueueBtn = document.getElementById('assessmentQueueBtn');
      assessmentQueueBtn.addEventListener('click', function () { openAssessmentView('pending'); });

      function openAssessmentView(tab) {
        var req;
        if (tab === 'pending') req = api('/api/admin/assessments/pending-review');
        else if (tab === 'payments') req = api('/api/admin/assessments/payments/pending');
        else req = api('/api/admin/assessments?limit=100');

        req
          .then(function (data) { renderAssessmentView(tab, data); })
          .catch(function (err) { toast(err.message, 'error'); });
      }

      function renderAssessmentView(tab, data) {
        var shell = modalShell('⚡ Electrical Shop Assessments', { wide: true });

        shell.body.appendChild(
          tabBar(
            [
              { key: 'pending', label: 'Pending Review' },
              { key: 'all', label: 'All Assessments' },
              { key: 'payments', label: 'Payments' },
            ],
            tab,
            openAssessmentView
          )
        );

        var content = document.createElement('div');
        shell.body.appendChild(content);

        if (tab === 'pending') renderPendingReview(content, data);
        else if (tab === 'payments') renderPaymentsTab(content, data);
        else renderAllAssessments(content, data);

        // Ops utility: run the background jobs now instead of waiting for a tick.
        var runBtn = document.createElement('button');
        runBtn.className = 'secondary';
        runBtn.textContent = '⚙ Run background jobs now';
        runBtn.title = 'No-show detection, feedback SLA, deferred payouts, partner quality';
        runBtn.addEventListener('click', function () {
          runBtn.disabled = true;
          runBtn.textContent = 'Running…';
          api('/api/admin/assessments/run-jobs', { method: 'POST', body: JSON.stringify({ task: 'all' }) })
            .then(function (res) {
              toast('Jobs run: ' + JSON.stringify(res.result), 'success');
              openAssessmentView(tab);
            })
            .catch(function (err) { toast(err.message, 'error'); })
            .finally(function () { runBtn.disabled = false; runBtn.textContent = '⚙ Run background jobs now'; });
        });
        shell.footer.appendChild(runBtn);
      }

      function renderPendingReview(container, data) {
        var rows = data.assessments || [];
        if (!rows.length) {
          container.innerHTML = '<p style="color:var(--muted);font-size:13px;">No assessments are awaiting review.</p>';
          return;
        }

        var wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        var html =
          '<table><thead><tr>' +
          '<th>Worker</th><th>City</th><th>Shop partner</th><th>Assessed</th>' +
          '<th>Score</th><th>Safety</th><th>Shop says</th><th></th>' +
          '</tr></thead><tbody>';

        rows.forEach(function (a) {
          var w = a.worker || {};
          var p = a.shopPartner || {};
          var f = a.feedback || {};
          var safetyBadge = f.safetyFailed
            ? '<span class="badge badge-safety-fail">✕ FAILED</span>'
            : '<span class="badge badge-safety-pass">✓ isolated</span>';
          html +=
            '<tr data-id="' + escapeHtml(a.id) + '" style="cursor:pointer;">' +
            safe`<td><strong>${w.fullName || '(no name)'}</strong><br/><span style="color:var(--muted);font-size:12px;">${w.phone || ''}</span></td>` +
            safe`<td>${(w.location && w.location.city) || p.city || '—'}</td>` +
            safe`<td>${p.shopName || '—'}<br/><span style="color:var(--muted);font-size:12px;">${p.ownerName || ''}</span></td>` +
            safe`<td>${fmtDate(a.feedbackSubmittedAt)}</td>` +
            safe`<td><span class="score-pill">${String(f.preliminaryScore === null || f.preliminaryScore === undefined ? '—' : f.preliminaryScore)}</span></td>` +
            '<td>' + safetyBadge + '</td>' +
            safe`<td>${String(f.overallRecommendation || '—').replace(/_/g, ' ')}</td>` +
            '<td><button class="secondary">Review →</button></td>' +
            '</tr>';
        });
        html += '</tbody></table>';
        wrap.innerHTML = html;

        wrap.querySelectorAll('tr[data-id]').forEach(function (tr) {
          tr.addEventListener('click', function () { openAssessmentDetail(tr.getAttribute('data-id')); });
        });
        container.appendChild(wrap);
      }

      function renderAllAssessments(container, data) {
        var counts = data.countsByStatus || {};
        var summary = document.createElement('div');
        summary.className = 'chip-row';
        summary.style.marginBottom = '10px';
        summary.innerHTML = Object.keys(counts)
          .map(function (k) { return safe`<span class="chip">${k.replace(/_/g, ' ')}: ${counts[k]}</span>`; })
          .join('');
        container.appendChild(summary);

        var rows = data.assessments || [];
        if (!rows.length) {
          container.innerHTML += '<p style="color:var(--muted);font-size:13px;">No assessments yet.</p>';
          return;
        }

        var wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        var html =
          '<table><thead><tr><th>Worker</th><th>Shop</th><th>Scheduled</th><th>Status</th>' +
          '<th>Score</th><th>Decision</th><th>Payout</th><th></th></tr></thead><tbody>';

        rows.forEach(function (a) {
          var w = a.worker || {};
          var p = a.shopPartner || {};
          var f = a.feedback || {};
          var pay = a.payment || {};
          var payTxt =
            (pay.upfrontPaid ? '✓' : '○') + ' ' + fmtMoney(pay.upfrontAmount) +
            ' / ' + (pay.deferredPaid ? '✓' : '○') + ' ' + fmtMoney(pay.deferredAmount);
          html +=
            '<tr data-id="' + escapeHtml(a.id) + '" style="cursor:pointer;">' +
            safe`<td><strong>${w.fullName || '(no name)'}</strong><br/><span style="color:var(--muted);font-size:12px;">${w.phone || ''}</span></td>` +
            safe`<td>${p.shopName || '—'}</td>` +
            safe`<td>${a.displayDateTime || fmtDate(a.scheduledAt)}</td>` +
            '<td>' + badge(a.status) + '</td>' +
            safe`<td>${String(f.preliminaryScore === null || f.preliminaryScore === undefined ? '—' : f.preliminaryScore)}</td>` +
            safe`<td>${a.finalDecision || '—'}</td>` +
            safe`<td style="font-size:12px;">${payTxt}</td>` +
            '<td><button class="secondary">Open →</button></td>' +
            '</tr>';
        });
        html += '</tbody></table>';
        wrap.innerHTML = html;
        wrap.querySelectorAll('tr[data-id]').forEach(function (tr) {
          tr.addEventListener('click', function () { openAssessmentDetail(tr.getAttribute('data-id')); });
        });
        container.appendChild(wrap);
      }

      function renderPaymentsTab(container, data) {
        var totals = data.totals || {};
        var head = document.createElement('div');
        head.className = 'chip-row';
        head.style.marginBottom = '12px';
        head.innerHTML =
          safe`<span class="chip">Upfront pending: ${(data.counts && data.counts.upfront) || 0} · ${fmtMoney(totals.upfrontPendingAmount)}</span>` +
          safe`<span class="chip">Deferred pending: ${(data.counts && data.counts.deferred) || 0} · ${fmtMoney(totals.deferredPendingAmount)}</span>`;
        container.appendChild(head);

        [
          { key: 'upfront', title: 'Upfront (₹300) — feedback submitted, payout not recorded', rows: data.upfrontPending || [] },
          { key: 'deferred', title: 'Deferred (₹200) — awaiting the worker\'s 10th job', rows: data.deferredPending || [] },
        ].forEach(function (group) {
          var sec = document.createElement('div');
          sec.className = 'detail-section';
          sec.innerHTML = '<h3>' + escapeHtml(group.title) + '</h3>';

          if (!group.rows.length) {
            sec.innerHTML += '<p style="color:var(--muted);font-size:13px;">Nothing pending.</p>';
            container.appendChild(sec);
            return;
          }

          group.rows.forEach(function (a) {
            var p = a.shopPartner || {};
            var w = a.worker || {};
            var row = document.createElement('div');
            row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #eef0f2;';
            row.innerHTML = safe`
              <div style="font-size:13px;">
                <strong>${p.shopName || '—'}</strong> · ${p.ownerName || ''} (${p.ownerPhone || ''})<br/>
                <span style="color:var(--muted);font-size:12px;">worker ${w.fullName || w.phone || '—'}${group.key === 'deferred' ? ' · jobs done: ' + (w.jobsCompleted || 0) : ''} · ${fmtMoney(a.payment && a.payment[group.key + 'Amount'])}</span>
              </div>`;
            var btn = document.createElement('button');
            btn.className = 'secondary';
            btn.textContent = 'Mark paid';
            btn.addEventListener('click', function () {
              var ref = window.prompt('Payment reference number (leave blank to send via the payout service):', '');
              if (ref === null) return;
              btn.disabled = true;
              api('/api/admin/assessments/' + a.id + '/payments/' + group.key + '/mark-paid', {
                method: 'POST',
                body: JSON.stringify(ref ? { reference: ref } : {}),
              })
                .then(function () { toast('Payment recorded', 'success'); openAssessmentView('payments'); })
                .catch(function (err) { toast(err.message, 'error'); btn.disabled = false; });
            });
            row.appendChild(btn);
            sec.appendChild(row);
          });
          container.appendChild(sec);
        });
      }

      // ---------- Assessment detail + decision ----------
      function openAssessmentDetail(id) {
        api('/api/admin/assessments/' + id)
          .then(function (data) { renderAssessmentDetail(data.assessment, data.worker); })
          .catch(function (err) { toast(err.message, 'error'); });
      }

      function renderAssessmentDetail(a, worker) {
        var shell = modalShell(safe`⚡ Assessment — ${(worker && worker.fullName) || 'worker'}`, { wide: true });
        var f = a.feedback || {};
        var p = a.shopPartner || {};

        // Safety verdict first — this is the one answer that must never be missed.
        if (f.submittedAt) {
          var banner = document.createElement('div');
          banner.className = 'safety-banner ' + (f.safetyFailed ? 'fail' : 'pass');
          banner.innerHTML = f.safetyFailed
            ? '⚠️ SAFETY FAILURE — the worker did NOT isolate the circuit before touching wires. Kaaryo policy is not to onboard.'
            : '✓ Safety check passed — the worker switched off the breaker/MCB before touching any wires.';
          shell.body.appendChild(banner);
        }

        // Worker profile + prior onboarding results.
        var wsec = document.createElement('div');
        wsec.className = 'detail-section';
        var block = (worker && worker.electricalAssessment) || {};
        wsec.innerHTML = safe`
          <h3>Worker</h3>
          <dl class="kv-grid">
            <dt>Name</dt><dd>${(worker && worker.fullName) || '—'}</dd>
            <dt>Phone</dt><dd>${(worker && worker.phone) || '—'}</dd>
            <dt>City</dt><dd>${(worker && worker.location && worker.location.city) || '—'}</dd>
            <dt>Trade</dt><dd>${(worker && worker.work && worker.work.primaryCategory) || 'cleaning'}</dd>
            <dt>Skills</dt><dd>${((worker && worker.work && worker.work.cleaningTypes) || []).join(', ') || '—'}</dd>
            <dt>Experience</dt><dd>${(worker && worker.work && worker.work.experience) || '—'}</dd>
            <dt>Onboarding step</dt><dd>${(worker && worker.onboardingStep) || '—'}</dd>
            <dt>Worker status</dt><dd>${(worker && worker.status) || '—'}</dd>
            <dt>Attempt</dt><dd>${String(a.attempt || 1)}</dd>
            <dt>No-shows</dt><dd>${String(block.noShowCount || 0)}</dd>
            <dt>Cancellations</dt><dd>${String(block.cancellationCount || 0)}</dd>
          </dl>`;
        shell.body.appendChild(wsec);

        // The session itself.
        var ssec = document.createElement('div');
        ssec.className = 'detail-section';
        ssec.innerHTML = safe`
          <h3>Session</h3>
          <dl class="kv-grid">
            <dt>Status</dt><dd>${String(a.status || '').replace(/_/g, ' ')}</dd>
            <dt>Shop</dt><dd>${p.shopName || '—'} (${p.city || '—'})</dd>
            <dt>Shop owner</dt><dd>${p.ownerName || '—'} · ${p.ownerPhone || '—'}</dd>
            <dt>Scheduled</dt><dd>${a.displayDateTime || fmtDate(a.scheduledAt)}</dd>
            <dt>Checked in</dt><dd>${a.workerArrivedAt ? fmtDate(a.workerArrivedAt) + ' (' + (a.checkInDistanceMeters === null || a.checkInDistanceMeters === undefined ? '?' : a.checkInDistanceMeters) + ' m from shop)' : 'not checked in'}</dd>
            <dt>Feedback at</dt><dd>${a.feedbackSubmittedAt ? fmtDate(a.feedbackSubmittedAt) : '—'}</dd>
          </dl>`;
        if (a.feedbackLink) {
          var linkNote = document.createElement('p');
          linkNote.style.cssText = 'font-size:12px;margin-top:8px;word-break:break-all;';
          linkNote.innerHTML =
            '<strong>Shop owner form link</strong> (valid until 24h after the slot ends):<br/>' +
            safe`<a href="${a.feedbackLink}" target="_blank" rel="noopener">${a.feedbackLink}</a>`;
          ssec.appendChild(linkNote);
        }
        shell.body.appendChild(ssec);

        // Shop owner's feedback.
        if (f.submittedAt) {
          var fsec = document.createElement('div');
          fsec.className = 'detail-section';
          fsec.innerHTML = safe`
            <h3>Shop owner feedback <span class="score-pill">${String(f.preliminaryScore)}/100</span></h3>
            <dl class="kv-grid">
              <dt>Isolated circuit first</dt><dd>${f.isolatedCircuitBeforeTouching ? 'Yes' : 'NO — safety failure'}</dd>
              <dt>Tool handling</dt><dd>${String(f.toolHandlingScore || '—')} / 5</dd>
              <dt>Repair quality</dt><dd>${String(f.repairQualityScore || '—')} / 5</dd>
              <dt>Asked sensible questions</dt><dd>${f.askedSensibleQuestions ? 'Yes' : 'No'}</dd>
              <dt>Would hire in own shop</dt><dd>${f.wouldHireInShop || '—'}</dd>
              <dt>Recommendation</dt><dd>${String(f.overallRecommendation || '—').replace(/_/g, ' ')}</dd>
              <dt>Engine says</dt><dd>${f.engineRecommendation || '—'}</dd>
              <dt>Submitted via</dt><dd>${f.submittedVia || '—'}</dd>
            </dl>
            <p style="margin-top:10px;font-size:13px;"><strong>Tasks performed:</strong><br/>${f.tasksPerformed || '—'}</p>
            <p style="margin-top:8px;font-size:13px;"><strong>Additional notes:</strong><br/>${f.additionalNotes || '—'}</p>`;
          shell.body.appendChild(fsec);
        }

        // Payout state.
        var pay = a.payment || {};
        var paysec = document.createElement('div');
        paysec.className = 'detail-section';
        paysec.innerHTML = safe`
          <h3>Shop owner payout</h3>
          <dl class="kv-grid">
            <dt>Upfront</dt><dd>${fmtMoney(pay.upfrontAmount)} — ${pay.upfrontPaid ? 'paid ' + fmtDate(pay.upfrontPaidAt) + ' (ref ' + (pay.upfrontReference || '—') + ')' : 'not paid'}</dd>
            <dt>Deferred</dt><dd>${fmtMoney(pay.deferredAmount)} — ${pay.deferredPaid ? 'paid ' + fmtDate(pay.deferredPaidAt) + ' (ref ' + (pay.deferredReference || '—') + ')' : 'pending'}</dd>
            <dt>Trigger</dt><dd>${pay.deferredTriggerEvent || '—'}</dd>
          </dl>`;
        shell.body.appendChild(paysec);

        // Decision.
        if (a.status === 'feedback_submitted') {
          var dsec = document.createElement('div');
          dsec.className = 'detail-section';
          dsec.innerHTML =
            '<h3>Decision</h3>' +
            '<label class="field" style="display:block;"><span>Notes (required to reject)</span>' +
            '<textarea id="asmtNotes" rows="3" style="width:100%;"></textarea></label>';
          shell.body.appendChild(dsec);

          var approveBtn = document.createElement('button');
          approveBtn.textContent = '✓ Approve — issue certificate';
          var rejectBtn = document.createElement('button');
          rejectBtn.className = 'danger';
          rejectBtn.textContent = '✕ Reject';

          function decide(decision) {
            var notes = (document.getElementById('asmtNotes') || {}).value || '';
            if (decision === 'rejected' && !notes.trim()) {
              toast('Notes are required to reject', 'error');
              return;
            }
            approveBtn.disabled = true;
            rejectBtn.disabled = true;
            api('/api/admin/assessments/' + a.id + '/decide', {
              method: 'POST',
              body: JSON.stringify({ decision: decision, adminNotes: notes }),
            })
              .then(function (res) {
                toast(res.message || 'Decision recorded', 'success');
                closeModal();
                openAssessmentView('pending');
                loadWorkers();
              })
              .catch(function (err) {
                toast(err.message, 'error');
                approveBtn.disabled = false;
                rejectBtn.disabled = false;
              });
          }
          approveBtn.addEventListener('click', function () { decide('approved'); });
          rejectBtn.addEventListener('click', function () { decide('rejected'); });
          shell.footer.appendChild(rejectBtn);
          shell.footer.appendChild(approveBtn);
        } else if (a.finalDecision) {
          var done = document.createElement('div');
          done.style.cssText = 'font-size:13px;color:var(--muted);';
          done.innerHTML = safe`Decided ${a.finalDecision} on ${fmtDate(a.finalDecisionAt)}${a.finalDecisionNotes ? ' — ' + a.finalDecisionNotes : ''}`;
          shell.footer.appendChild(done);
        }
      }

      // ---------- Shop partners ----------
      var shopPartnersBtn = document.getElementById('shopPartnersBtn');
      shopPartnersBtn.addEventListener('click', openPartnersView);

      function openPartnersView() {
        api('/api/admin/shop-partners?limit=100')
          .then(function (data) { renderPartnersView(data); })
          .catch(function (err) { toast(err.message, 'error'); });
      }

      function renderPartnersView(data) {
        var shell = modalShell('🏪 Shop Partners', { wide: true });
        var partners = data.partners || [];

        if (!partners.length) {
          shell.body.innerHTML =
            '<p style="color:var(--muted);font-size:13px;">No shop partners yet. Add one, or run ' +
            '<code>node src/scripts/seedShopPartners.js</code> to seed a few with a week of slots.</p>';
        } else {
          var wrap = document.createElement('div');
          wrap.className = 'table-wrap';
          var html =
            '<table><thead><tr><th>Shop</th><th>City</th><th>Status</th><th>Assessments</th>' +
            '<th>Approval rate</th><th>Avg worker rating</th><th>Quality</th><th>Last assessment</th><th></th>' +
            '</tr></thead><tbody>';

          partners.forEach(function (p) {
            var s = p.stats || {};
            var q = s.partnerQualityScore;
            html +=
              '<tr data-id="' + escapeHtml(p.id) + '" style="cursor:pointer;">' +
              safe`<td><strong>${p.shopName}</strong><br/><span style="color:var(--muted);font-size:12px;">${p.ownerName} · ${p.ownerPhone}</span></td>` +
              safe`<td>${p.city}${p.locality ? ' / ' + p.locality : ''}</td>` +
              '<td>' + badge(p.status) + '</td>' +
              safe`<td>${String(s.totalAssessmentsConducted || 0)} (${String(s.totalNoShows || 0)} no-show)</td>` +
              safe`<td>${p.approvalRate === null || p.approvalRate === undefined ? '—' : p.approvalRate + '%'}</td>` +
              safe`<td>${s.averageDownstreamRating === null || s.averageDownstreamRating === undefined ? '—' : s.averageDownstreamRating}</td>` +
              '<td class="' + qualityClass(q) + '">' + escapeHtml(q === null || q === undefined ? '—' : q) + '</td>' +
              safe`<td>${s.lastAssessmentAt ? fmtDate(s.lastAssessmentAt) : '—'}</td>` +
              '<td><button class="secondary">Open →</button></td>' +
              '</tr>';
          });
          html += '</tbody></table>';
          wrap.innerHTML = html;
          wrap.querySelectorAll('tr[data-id]').forEach(function (tr) {
            tr.addEventListener('click', function () { openPartnerDetail(tr.getAttribute('data-id')); });
          });
          shell.body.appendChild(wrap);

          var legend = document.createElement('p');
          legend.style.cssText = 'font-size:12px;color:var(--muted);margin-top:10px;';
          legend.innerHTML =
            'Quality score: <span class="q-good">&gt;80 good</span> · <span class="q-warn">60–80 watch</span> · ' +
            '<span class="q-bad">&lt;60 auto-paused</span> (below 40 auto-terminated).';
          shell.body.appendChild(legend);
        }

        var addBtn = document.createElement('button');
        addBtn.textContent = '+ Add shop partner';
        addBtn.addEventListener('click', openCreatePartnerForm);
        shell.footer.appendChild(addBtn);
      }

      function openCreatePartnerForm() {
        var shell = modalShell('🏪 Add shop partner');
        var fields = [
          ['shopName', 'Shop name', 'text', true],
          ['ownerName', 'Owner name', 'text', true],
          ['ownerPhone', 'Owner phone (10 digits)', 'text', true],
          ['ownerEmail', 'Owner email (optional)', 'text', false],
          ['city', 'City', 'text', true],
          ['locality', 'Locality', 'text', false],
          ['fullAddress', 'Full address', 'text', true],
          ['latitude', 'Latitude', 'number', true],
          ['longitude', 'Longitude', 'number', true],
          ['upfrontPayment', 'Upfront payout (₹)', 'number', false],
          ['deferredPayment', 'Deferred payout (₹)', 'number', false],
          ['upiId', 'UPI ID (optional)', 'text', false],
        ];
        var form = document.createElement('div');
        fields.forEach(function (f) {
          var label = document.createElement('label');
          label.className = 'field';
          label.style.display = 'block';
          label.innerHTML =
            safe`<span>${f[1]}${f[3] ? ' *' : ''}</span>` +
            '<input type="' + f[2] + '" id="sp_' + f[0] + '" style="width:100%;" />';
          form.appendChild(label);
        });
        var chan = document.createElement('label');
        chan.className = 'field';
        chan.style.display = 'block';
        chan.innerHTML =
          '<span>Feedback channel</span>' +
          '<select id="sp_feedbackChannel" style="width:100%;">' +
          '<option value="both">SMS + WhatsApp</option><option value="sms">SMS only</option>' +
          '<option value="whatsapp">WhatsApp only</option></select>';
        form.appendChild(chan);
        shell.body.appendChild(form);

        var saveBtn = document.createElement('button');
        saveBtn.textContent = 'Create partner';
        saveBtn.addEventListener('click', function () {
          var payload = {};
          fields.forEach(function (f) {
            var v = document.getElementById('sp_' + f[0]).value;
            if (v !== '') payload[f[0]] = f[2] === 'number' ? Number(v) : v;
          });
          payload.feedbackChannel = document.getElementById('sp_feedbackChannel').value;
          saveBtn.disabled = true;
          api('/api/admin/shop-partners', { method: 'POST', body: JSON.stringify(payload) })
            .then(function () { toast('Shop partner created', 'success'); openPartnersView(); })
            .catch(function (err) { toast(err.message, 'error'); saveBtn.disabled = false; });
        });
        shell.footer.appendChild(saveBtn);
      }

      function openPartnerDetail(partnerId) {
        api('/api/admin/shop-partners/' + partnerId)
          .then(function (data) { renderPartnerDetail(data); })
          .catch(function (err) { toast(err.message, 'error'); });
      }

      function renderPartnerDetail(data) {
        var p = data.partner;
        var shell = modalShell(safe`🏪 ${p.shopName}`, { wide: true });
        var s = p.stats || {};

        var info = document.createElement('div');
        info.className = 'detail-section';
        info.innerHTML = safe`
          <h3>Partner</h3>
          <dl class="kv-grid">
            <dt>Owner</dt><dd>${p.ownerName} · ${p.ownerPhone}${p.ownerEmail ? ' · ' + p.ownerEmail : ''}</dd>
            <dt>Address</dt><dd>${p.fullAddress}</dd>
            <dt>Coordinates</dt><dd>${String(p.lat)}, ${String(p.lng)}</dd>
            <dt>Status</dt><dd>${p.status}${p.autoActionReason ? ' — ' + p.autoActionReason : ''}</dd>
            <dt>Channel</dt><dd>${p.feedbackChannel}</dd>
            <dt>Payout split</dt><dd>${fmtMoney(p.payment && p.payment.upfront)} upfront + ${fmtMoney(p.payment && p.payment.deferred)} deferred</dd>
            <dt>Assessments</dt><dd>${String(s.totalAssessmentsConducted || 0)} conducted · ${String(s.totalWorkersApproved || 0)} approved · ${String(s.totalWorkersRejected || 0)} rejected · ${String(s.totalNoShows || 0)} no-show</dd>
            <dt>Approval rate</dt><dd>${p.approvalRate === null || p.approvalRate === undefined ? '—' : p.approvalRate + '%'}</dd>
            <dt>Quality score</dt><dd>${s.partnerQualityScore === null || s.partnerQualityScore === undefined ? 'not yet scored' : s.partnerQualityScore}</dd>
          </dl>`;
        shell.body.appendChild(info);

        // Status controls.
        var ctrl = document.createElement('div');
        ctrl.className = 'detail-section';
        ctrl.innerHTML = '<h3>Status</h3><p style="font-size:12px;color:var(--muted);">Pausing or terminating withdraws all future slots and asks any booked workers to rebook.</p>';
        var ctrlRow = document.createElement('div');
        ctrlRow.className = 'chip-row';
        ['active', 'paused', 'terminated'].forEach(function (st) {
          if (st === p.status) return;
          var b = document.createElement('button');
          b.className = st === 'terminated' ? 'danger' : 'secondary';
          b.textContent = 'Set ' + st;
          b.addEventListener('click', function () {
            var reason = st === 'active' ? '' : window.prompt('Reason (shown in the audit log):', '');
            if (st !== 'active' && reason === null) return;
            b.disabled = true;
            api('/api/admin/shop-partners/' + p.id + '/status', {
              method: 'PATCH',
              body: JSON.stringify({ status: st, reason: reason }),
            })
              .then(function (res) {
                toast('Partner ' + st + (res.slotsWithdrawn ? ' · ' + res.slotsWithdrawn + ' slot(s) withdrawn' : ''), 'success');
                openPartnerDetail(p.id);
              })
              .catch(function (err) { toast(err.message, 'error'); b.disabled = false; });
          });
          ctrlRow.appendChild(b);
        });
        var recalcBtn = document.createElement('button');
        recalcBtn.className = 'secondary';
        recalcBtn.textContent = '↻ Recalculate quality score';
        recalcBtn.addEventListener('click', function () {
          recalcBtn.disabled = true;
          api('/api/admin/shop-partners/' + p.id + '/recalculate-quality', { method: 'POST' })
            .then(function (res) {
              toast('Score: ' + res.snapshot.partnerQualityScore + (res.autoAction ? ' → auto-' + res.autoAction : ''), 'success');
              openPartnerDetail(p.id);
            })
            .catch(function (err) { toast(err.message, 'error'); recalcBtn.disabled = false; });
        });
        ctrlRow.appendChild(recalcBtn);
        ctrl.appendChild(ctrlRow);
        shell.body.appendChild(ctrl);

        // Quality history.
        if ((p.qualityHistory || []).length) {
          var qh = document.createElement('div');
          qh.className = 'detail-section';
          var qhtml =
            '<h3>Monthly quality history</h3><div class="table-wrap"><table><thead><tr>' +
            '<th>Month</th><th>Assessed</th><th>Approved</th><th>Rejected</th><th>Avg rating</th><th>Complaints</th><th>Score</th>' +
            '</tr></thead><tbody>';
          p.qualityHistory
            .slice()
            .sort(function (a, b) { return new Date(b.month) - new Date(a.month); })
            .forEach(function (h) {
              qhtml +=
                safe`<tr><td>${String(h.month).slice(0, 7)}</td><td>${String(h.totalWorkersAssessed)}</td>` +
                safe`<td>${String(h.totalWorkersApproved)}</td><td>${String(h.totalWorkersRejected)}</td>` +
                safe`<td>${h.avgRatingOfApprovedWorkers === null ? '—' : h.avgRatingOfApprovedWorkers}</td>` +
                safe`<td>${String(h.workersWhoCausedComplaints)}</td>` +
                '<td class="' + qualityClass(h.partnerQualityScore) + '">' + escapeHtml(h.partnerQualityScore) + '</td></tr>';
            });
          qhtml += '</tbody></table></div>';
          qh.innerHTML = qhtml;
          shell.body.appendChild(qh);
        }

        // Upcoming slots + add-slots control.
        var slotsec = document.createElement('div');
        slotsec.className = 'detail-section';
        slotsec.innerHTML = '<h3>Upcoming slots (' + escapeHtml((data.upcomingSlots || []).length) + ')</h3>';
        if (!(data.upcomingSlots || []).length) {
          slotsec.innerHTML += '<p style="color:var(--muted);font-size:13px;">No upcoming slots. Add some below so workers can book.</p>';
        } else {
          var stbl = '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Time</th><th>Seats</th><th>Booked by</th><th></th></tr></thead><tbody>';
          data.upcomingSlots.forEach(function (sl) {
            stbl +=
              '<tr>' +
              safe`<td>${String(sl.slotDate).slice(0, 10)}</td>` +
              safe`<td>${sl.slotStartTime}–${sl.slotEndTime}</td>` +
              safe`<td>${String(sl.capacityRemaining)}/${String(sl.maxWorkersPerSlot)}</td>` +
              safe`<td>${sl.isAvailable ? '—' : 'booked'}</td>` +
              '<td><button class="danger" data-slot="' + escapeHtml(sl._id) + '">Withdraw</button></td>' +
              '</tr>';
          });
          stbl += '</tbody></table></div>';
          var stblWrap = document.createElement('div');
          stblWrap.innerHTML = stbl;
          stblWrap.querySelectorAll('button[data-slot]').forEach(function (b) {
            b.addEventListener('click', function () {
              if (!window.confirm('Withdraw this slot? Any worker booked into it will be asked to rebook.')) return;
              api('/api/admin/shop-partners/' + p.id + '/slots/' + b.getAttribute('data-slot'), { method: 'DELETE' })
                .then(function (res) {
                  toast('Slot withdrawn' + (res.cancelledBooking ? ' — worker notified to rebook' : ''), 'success');
                  openPartnerDetail(p.id);
                })
                .catch(function (err) { toast(err.message, 'error'); });
            });
          });
          slotsec.appendChild(stblWrap);
        }

        // Bulk slot creation: N days × chosen times.
        var addSlots = document.createElement('div');
        addSlots.style.cssText = 'margin-top:12px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;';
        addSlots.innerHTML =
          '<label class="field"><span>From date</span><input type="date" id="sl_from" /></label>' +
          '<label class="field"><span>Days</span><input type="number" id="sl_days" value="7" min="1" max="30" style="width:80px;" /></label>' +
          '<label class="field"><span>Times (comma separated, 24h)</span><input type="text" id="sl_times" value="10:00,11:30,15:00,16:30" style="width:240px;" /></label>' +
          '<label class="field"><span>Workers/slot</span><input type="number" id="sl_max" value="1" min="1" max="5" style="width:80px;" /></label>';
        var addSlotBtn = document.createElement('button');
        addSlotBtn.textContent = '+ Create slots';
        addSlotBtn.addEventListener('click', function () {
          var from = document.getElementById('sl_from').value;
          var days = Number(document.getElementById('sl_days').value) || 1;
          var times = document.getElementById('sl_times').value.split(',').map(function (t) { return t.trim(); }).filter(Boolean);
          var max = Number(document.getElementById('sl_max').value) || 1;
          if (!from) { toast('Pick a start date', 'error'); return; }
          if (!times.length) { toast('Enter at least one time', 'error'); return; }

          var slots = [];
          for (var d = 0; d < days; d++) {
            var day = new Date(from + 'T00:00:00Z');
            day.setUTCDate(day.getUTCDate() + d);
            var dateStr = day.toISOString().slice(0, 10);
            times.forEach(function (t) {
              slots.push({ slotDate: dateStr, slotStartTime: t, maxWorkersPerSlot: max });
            });
          }
          addSlotBtn.disabled = true;
          api('/api/admin/shop-partners/' + p.id + '/slots', {
            method: 'POST',
            body: JSON.stringify({ slots: slots }),
          })
            .then(function (res) {
              toast(res.created + ' slot(s) created' + (res.skippedDuplicates ? ', ' + res.skippedDuplicates + ' duplicate(s) skipped' : ''), 'success');
              openPartnerDetail(p.id);
            })
            .catch(function (err) { toast(err.message, 'error'); addSlotBtn.disabled = false; });
        });
        addSlots.appendChild(addSlotBtn);
        slotsec.appendChild(addSlots);
        shell.body.appendChild(slotsec);

        // Assessment history at this shop.
        var hist = document.createElement('div');
        hist.className = 'detail-section';
        var rows = data.assessments || [];
        hist.innerHTML = '<h3>Assessment history (' + escapeHtml(rows.length) + ')</h3>';
        if (!rows.length) {
          hist.innerHTML += '<p style="color:var(--muted);font-size:13px;">No assessments conducted here yet.</p>';
        } else {
          var htbl = '<div class="table-wrap"><table><thead><tr><th>Worker</th><th>When</th><th>Status</th><th>Score</th><th>Safety</th><th>Decision</th><th>Worker rating now</th></tr></thead><tbody>';
          rows.forEach(function (a) {
            var w = a.worker || {};
            var f = a.feedback || {};
            htbl +=
              '<tr data-id="' + escapeHtml(a.id) + '" style="cursor:pointer;">' +
              safe`<td>${w.fullName || w.phone || '—'}</td>` +
              safe`<td>${a.displayDateTime || fmtDate(a.scheduledAt)}</td>` +
              '<td>' + badge(a.status) + '</td>' +
              safe`<td>${f.preliminaryScore === null || f.preliminaryScore === undefined ? '—' : f.preliminaryScore}</td>` +
              '<td>' + (f.submittedAt ? (f.safetyFailed ? '<span class="badge badge-safety-fail">✕</span>' : '<span class="badge badge-safety-pass">✓</span>') : '—') + '</td>' +
              safe`<td>${a.finalDecision || '—'}</td>` +
              safe`<td>${w.rating === null || w.rating === undefined ? 'new' : w.rating} (${String(w.jobsCompleted || 0)} jobs)</td>` +
              '</tr>';
          });
          htbl += '</tbody></table></div>';
          var htblWrap = document.createElement('div');
          htblWrap.innerHTML = htbl;
          htblWrap.querySelectorAll('tr[data-id]').forEach(function (tr) {
            tr.addEventListener('click', function () { openAssessmentDetail(tr.getAttribute('data-id')); });
          });
          hist.appendChild(htblWrap);
        }
        shell.body.appendChild(hist);
      }

      // ---------- Bootstrap ----------
      var existing = loadSession();
      if (existing && existing.token && existing.apiBase) {
        // Always force the configured DEFAULT_API_BASE so we don't try connecting to stale URLs from localStorage
        existing.apiBase = DEFAULT_API_BASE;
        state.apiBase = existing.apiBase;
        state.token = existing.token;
        state.adminEmail = existing.adminEmail;
        apiBaseInput.value = existing.apiBase;
        saveSession();
        showDashboard();
        loadWorkers();
      } else {
        showLogin();
      }
    })();
  </script>
</body>

</html>
